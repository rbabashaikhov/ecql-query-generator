[project]
name = "ecql-query-generator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ruslan Babashaikhov", email = "ruslan.babashaikhov@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
    "huggingface-hub>=2.3.0",
    "peft>=0.21.2",
    "psutil>=7.2.2",
    "safetensors>=0.8.0",
    "torch>=2.14.1",
    "transformers>=5.20.2",
    "trl>=1.16.0",
]

[project.scripts]
ecql-query-generator = "ecql_query_generator:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
